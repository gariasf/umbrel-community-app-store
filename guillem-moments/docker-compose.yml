services:
  app_proxy:
    environment:
      APP_HOST: guillem-moments_server_1
      APP_PORT: 8080

  server:
    image: ghcr.io/gariasf/moments:0.7.1@sha256:2deba7428d8476d1206315eed0e0706c3ab74b39b81c8e73fb3a7e88253d7bd5
    restart: on-failure
    user: "1000:1000"
    environment:
      MOMENTS_HOME: /home
      MOMENTS_DATA: /data
    volumes:
      # All of Home read-only, with MeTube's downloads and the Moments folder
      # writable on top. hooks/pre-start makes the Moments folder.
      - ${UMBREL_ROOT}/home:/home:ro
      - ${UMBREL_ROOT}/home/Downloads/metube:/home/Downloads/metube
      - ${UMBREL_ROOT}/home/Moments:/home/Moments
      # Uploads, saves.json and the cache.
      - ${APP_DATA_DIR}/data:/data
