manifestVersion: 2.0
id: guillem-moments
name: Moments
tagline: Keep the parts of videos you love, and loop them
category: media
icon: https://cdn.jsdelivr.net/gh/gariasf/umbrel-community-app-store@d3f999915af298c57b6dc7c3172d49623d859758/guillem-moments/icon.svg
version: "0.8.0"
port: 3780
description: >-
  Mark the start and end of a stretch of any video in Home, such as a movie or a
  MeTube download, or of one you upload, and keep it as its own video in Home/Moments, to replay on loop.
  Moments reads all of Home and changes nothing in it except Downloads/metube
  and Moments.
developer: Guillem
website: https://github.com/gariasf/moments-app
submitter: Guillem
submission: https://github.com/gariasf/umbrel-community-app-store
repo: https://github.com/gariasf/moments-app
support: https://github.com/gariasf/moments-app
gallery: []
releaseNotes: >-
  Moments has a sidebar on every screen, with the Library, the Trimmer, your
  Sources and the Queue. The Library is a grid, and a Moment plays beside the
  Queue. The Trimmer keeps the Source list beside the video playing and gathers
  its controls into one panel. Drop a video on the Source list to upload it,
  and follow the upload at the foot of the sidebar, where you can cancel it.
dependencies: []
path: ""
permissions:
  - GPU
backupIgnore:
  - data/uploads
  - data/cache
