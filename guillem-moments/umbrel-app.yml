manifestVersion: 2.0
id: guillem-moments
name: Moments
tagline: Keep the parts of videos you love, and loop them
category: media
icon: https://cdn.jsdelivr.net/gh/gariasf/umbrel-community-app-store@d3f999915af298c57b6dc7c3172d49623d859758/guillem-moments/icon.svg
version: "0.3.0"
port: 3780
description: >-
  Mark the start and end of a stretch of any video in Home, such as a movie or a
  MeTube download, and keep it as its own video in Home/Moments, to replay on loop.
  Moments reads all of Home and changes nothing in it except Downloads/metube
  and Moments.
developer: Guillem
website: https://github.com/gariasf/moments-app
submitter: Guillem
submission: https://github.com/gariasf/umbrel-community-app-store
repo: https://github.com/gariasf/moments-app
support: https://github.com/gariasf/moments-app
gallery: []
releaseNotes: >-
  Mark a Moment in the Trimmer with I and O while watching, fine-tune its start
  and end as it loops, pick its audio track, and save it into Home/Moments.
  Saves show their progress, carry on after a restart, and say why one failed,
  with Retry and Dismiss. Video or audio that Safari or Chrome can't play is
  converted as it saves, video on the GPU. The Library lists your Moments,
  newest first, with their posters.
dependencies: []
path: ""
permissions:
  - GPU
backupIgnore:
  - data/uploads
  - data/cache
